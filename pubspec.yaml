name: vouch_app
description: "Vouch - Privacy-first referral app for trusted local service providers"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Supabase
  supabase_flutter: ^2.8.4

  # Navigation
  go_router: ^14.8.1

  # Security & Crypto
  crypto: ^3.0.6
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.2.4

  # UI & Accessibility
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.17

  # Contacts
  flutter_contacts: ^1.1.9+2

  # Maps & Location
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Networking & API
  http: ^1.3.0
  dio: ^5.7.0

  # Local Storage
  shared_preferences: ^2.3.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Google AI (Gemini)
  google_generative_ai: ^0.4.6

  # Payments
  flutter_stripe: ^11.3.0

  # Deep Linking
  app_links: ^6.4.0

  # Share
  share_plus: ^10.1.4

  # URL Launcher
  url_launcher: ^6.3.1

  # Image Handling
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # PDF Generation
  pdf: ^3.11.2
  printing: ^5.13.5

  # UUID
  uuid: ^4.5.1

  # Intl
  intl: ^0.19.0

  # Haptic Feedback (built into Flutter services)
  # Permission Handler
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14
  mockito: ^5.4.5
  build_verify: ^3.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
